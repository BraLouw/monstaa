<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>monstaa! — Pixel Monster Run</title>
<style>
:root{--red:#e8444f;--green:#74e36a;--gold:#ffd45a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:22px 14px;background:#090909;color:#f5f5f5;font-family:"Courier New",monospace;display:flex;align-items:center;justify-content:center;user-select:none}
main{width:min(900px,100%)}
header{text-align:center;margin-bottom:14px}
h1{font-size:clamp(38px,7vw,62px);line-height:1;margin:0;color:var(--red);letter-spacing:4px;text-shadow:4px 4px #4d1118,7px 7px #000}
.subtitle{margin:9px 0 0;color:#8d8d8d;font-size:11px;letter-spacing:3px}
.frame{position:relative;border:4px solid #444;background:#171717;box-shadow:0 0 28px #e8444f30;overflow:hidden}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#171717}
.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:bold;font-size:14px;text-shadow:2px 2px #000}
.hud span{background:#090909bb;padding:7px 10px;border:1px solid #555}
#bossHud{display:none;position:absolute;top:48px;left:50%;transform:translateX(-50%);width:min(260px,60%);text-align:center;font-size:11px;color:#ffaaaa;text-shadow:2px 2px #000}
.bar{height:9px;border:1px solid #eee;background:#48191d;margin-top:5px}
#bossFill{height:100%;width:100%;background:#e8444f}
.overlay{position:absolute;inset:0;background:#050505d9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.dialog{max-width:480px}
.dialog h2{color:var(--gold);font-size:clamp(24px,5vw,38px);margin:0 0 12px;text-shadow:3px 3px #000}
.dialog p{color:#ccc;line-height:1.6;font-size:13px}
button{font-family:inherit;font-weight:bold;cursor:pointer;color:white;background:#a82323;border:3px solid #e44b55;padding:12px 22px;font-size:16px;box-shadow:0 5px #54151a}
button:hover{background:#d1323d}
button:active{transform:translateY(4px);box-shadow:0 1px #54151a}
.controls{margin-top:14px;padding:14px;background:#151515;border:2px solid #333;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.help{color:#aaa;font-size:12px;line-height:1.8}
.settings{display:flex;gap:8px;flex-wrap:wrap}
.key{background:#292929;border:2px solid #555;color:#ffd45a;padding:7px 10px;font-size:12px;cursor:pointer;box-shadow:none}
.key.listening{background:#a82323;color:white;border-color:#ff7777}
.mobile{display:none;gap:10px;margin-top:12px}
.mobile button{flex:1}
@media(max-width:600px){body{padding:12px 8px}.controls{align-items:flex-start}.mobile{display:flex}.hud{font-size:11px;top:6px;left:6px;right:6px}.hud span{padding:5px}}
</style>
</head>
<body>
<main>
<header><h1>monstaa!</h1><p class="subtitle">A TINY MONSTER. A BIG ADVENTURE.</p></header>
<section class="frame">
<canvas id="game" width="900" height="390" aria-label="Monstaa pixel-art game"></canvas>
<div class="hud"><span id="score">SCORE 0000</span><span id="stage">SPIKES 0 / 5</span></div>
<div id="bossHud">BOSS HP<div class="bar"><div id="bossFill"></div></div></div>
<div class="overlay" id="overlay"><div class="dialog"><h2 id="overlayTitle">READY, MONSTAA?</h2><p id="overlayText">Jump over the hazards. Survive 5 obstacles to wake the boss, then bonk it with your attack key!</p><button id="startBtn">START GAME</button></div></div>
</section>
<div class="controls">
<div class="help"><b>HOW TO PLAY</b><br>RUN: jump over spikes, crates, and slime.<br>BOSS: press your attack key to bonk it.</div>
<div class="settings"><button class="key" id="jumpKey">JUMP: SPACE</button><button class="key" id="attackKey">ATTACK: SPACE</button></div>
</div>
<div class="mobile"><button id="jumpTouch">JUMP</button><button id="attackTouch">ATTACK</button></div>
</main>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const W=canvas.width,H=canvas.height,FLOOR=320;
let mode='menu',score=0,passed=0,speed=5.5,lastTime=0,spawnTimer=0,obstacles=[],particles=[],enemy=null,keys={jump:'Space',attack:'Space'},remap=null,frame=0;
const player={x:115,y:FLOOR-42,w:38,h:42,vy:0,ground:true,blink:0};
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawMonster(x,y,s=1){
 const c='#74e36a';
 rect(x+5*s,y+9*s,28*s,25*s,c);rect(x+10*s,y+3*s,18*s,9*s,c);
 rect(x+1*s,y+17*s,7*s,13*s,c);rect(x+30*s,y+17*s,7*s,13*s,c);
 rect(x+10*s,y+31*s,8*s,10*s,'#3c9c49');rect(x+23*s,y+31*s,8*s,10*s,'#3c9c49');
 rect(x+22*s,y+12*s,7*s,8*s,'#fff');rect(x+26*s,y+14*s,3*s,4*s,'#111');
 rect(x+11*s,y+24*s,13*s,3*s,'#18351d');
}
function drawBackground(){
 rect(0,0,W,H,'#171717');
 for(let i=0;i<75;i++){let x=(i*137)%W,y=(i*61)%245;rect(x,y,2,2,i%3===0?'#555':'#333')}
 for(let i=0;i<12;i++){let x=i*88-10,h=35+(i*29)%75;rect(x,FLOOR-h,58,h,'#202020');rect(x+9,FLOOR-h+12,6,8,'#38302b');rect(x+31,FLOOR-h+27,6,8,'#38302b')}
 rect(0,FLOOR,W,70,'#292929');rect(0,FLOOR,W,4,'#777');
 for(let x=0;x<W;x+=32)rect(x,FLOOR+35,16,2,'#3b3b3b');
}
function drawObstacle(o){
 const x=o.x,y=o.y;
 if(o.type==='spike'){
  rect(x+7,y,12,24,'#ff6262');rect(x+3,y+12,20,15,'#bd2634');rect(x,y+23,26,8,'#8f1d2b');rect(x+10,y+6,3,8,'#ffaaaa');
 }else if(o.type==='crate'){
  rect(x,y,34,34,'#a66a35');rect(x+4,y+4,26,26,'#c58a4c');rect(x+6,y+6,22,4,'#e2b879');rect(x+6,y+24,22,4,'#70401f');rect(x+14,y+5,5,24,'#70401f');rect(x+5,y+14,24,5,'#70401f');
 }else if(o.type==='slime'){
  rect(x+5,y+13,28,18,'#4edc83');rect(x+1,y+20,36,11,'#2a9f68');rect(x+9,y+7,19,12,'#72ff9c');rect(x+11,y+17,4,5,'#102a20');rect(x+25,y+17,4,5,'#102a20');
 }else if(o.type==='double'){
  for(let n=0;n<2;n++){let sx=x+n*34;rect(sx+7,y,12,24,'#ff6262');rect(sx+3,y+12,20,15,'#bd2634');rect(sx,y+23,26,8,'#8f1d2b')}
 }else if(o.type==='tall'){
  rect(x+5,y-13,25,44,'#d4a84c');rect(x,y+16,35,15,'#94672c');rect(x+10,y-7,5,8,'#ffe39a');rect(x+22,y+3,5,7,'#ffe39a');
 }
}
function spawnObstacle(){
 const types=['spike','crate','slime','double','tall'];
 let type=types[Math.floor(Math.random()*types.length)];
 if(passed<3)type=Math.random()<.72?'spike':'crate';
 const dims={spike:[26,32],crate:[34,34],slime:[38,31],double:[60,32],tall:[35,44]}[type];
 obstacles.push({x:W+25,y:FLOOR-dims[1],w:dims[0],h:dims[1],type,scored:false});
}
function burst(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.8)*7,life:25,color})}
function jump(){if(mode==='run'&&player.ground){player.vy=-14;player.ground=false;}}
function attack(){if(mode==='fight'&&enemy){enemy.hp-=25;burst(enemy.x+30,enemy.y+30,'#ffd45a',14);if(enemy.hp<=0){score+=100;enemy=null;mode='run';passed=0;speed+=.7;$('bossHud').style.display='none';obstacles=[];spawnTimer=65;}}}
function updateHud(){$('score').textContent='SCORE '+String(score).padStart(4,'0');$('stage').textContent=mode==='fight'?'BOSS FIGHT':`HAZARDS ${Math.min(passed,5)} / 5`}
function reset(){
 score=0;passed=0;speed=5.5;obstacles=[];particles=[];enemy=null;spawnTimer=65;
 player.x=115;player.y=FLOOR-player.h;player.vy=0;player.ground=true;player.blink=0;
 $('bossHud').style.display='none';$('overlay').style.display='none';mode='run';updateHud();lastTime=0;
}
function gameOver(){
 mode='over';$('overlay').style.display='flex';$('overlayTitle').textContent='GAME OVER!';$('overlayText').textContent=`You scored ${score}. Monstaa will get them next time!`;$('startBtn').textContent='PLAY AGAIN';
}
function update(dt){
 frame++;
 if(mode==='run'){
  player.vy+=.72*dt;player.y+=player.vy*dt;
  if(player.y>=FLOOR-player.h){player.y=FLOOR-player.h;player.vy=0;player.ground=true}
  spawnTimer-=dt;if(spawnTimer<=0){spawnObstacle();spawnTimer=95+Math.random()*40}
  for(const o of obstacles){
   o.x-=speed*dt;
   if(!o.scored&&o.x+o.w<player.x){o.scored=true;score+=10;passed++;if(passed>=5){mode='fight';enemy={x:650,y:FLOOR-72,w:70,h:72,hp:100};$('bossHud').style.display='block';break}}
   const inset=8,px=player.x+inset,py=player.y+7,pw=player.w-inset*2,ph=player.h-7;
   if(o.type==='double'||o.type==='spike'||o.type==='tall'||o.type==='crate'||o.type==='slime'){
    const oy=o.type==='tall'?o.y+12:o.y+8,oh=o.h-8;
    if(px<o.x+o.w-3&&px+pw>o.x+3&&py<oy+oh&&py+ph>oy){gameOver();break}
   }
  }
  obstacles=obstacles.filter(o=>o.x>-100);
 }else if(mode==='fight'&&enemy){
  enemy.x=Math.max(275,enemy.x-.35*dt);$('bossFill').style.width=enemy.hp+'%';
 }
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
 updateHud();
}
function drawBoss(){
 if(!enemy)return;let x=enemy.x,y=enemy.y;
 rect(x+12,y+12,46,55,'#8d45c5');rect(x+5,y+27,12,27,'#69319a');rect(x+53,y+27,12,27,'#69319a');
 rect(x+18,y+2,13,15,'#b879e6');rect(x+43,y+2,13,15,'#b879e6');
 rect(x+22,y+25,10,11,'#fff');rect(x+42,y+25,10,11,'#fff');rect(x+26,y+28,4,5,'#111');rect(x+45,y+28,4,5,'#111');
 rect(x+27,y+48,25,5,'#321342');rect(x+19,y+64,14,8,'#54267b');rect(x+45,y+64,14,8,'#54267b');
}
function draw(){
 drawBackground();
 obstacles.forEach(drawObstacle);
 if(mode==='fight')drawBoss();
 drawMonster(player.x,player.y);
 particles.forEach(p=>rect(p.x,p.y,4,4,p.color));
 if(mode==='fight'){$('bossFill').style.width=enemy.hp+'%'}
}
function loop(timestamp){
 if(!lastTime)lastTime=timestamp;
 const dt=Math.min((timestamp-lastTime)/16.67,2);lastTime=timestamp;
 if(mode==='run'||mode==='fight')update(dt);
 draw();requestAnimationFrame(loop);
}
function keyDown(e){
 if(remap){if(e.code==='Escape'){remap=null;refreshKeys();return}keys[remap]=e.code;remap=null;refreshKeys();e.preventDefault();return}
 if(e.code===keys.jump){if(mode==='run'){jump();e.preventDefault()}else if(mode==='fight'){attack();e.preventDefault()}}
}
function refreshKeys(){
 $('jumpKey').textContent='JUMP: '+(keys.jump==='Space'?'SPACE':keys.jump.replace('Arrow',''));
 $('attackKey').textContent='ATTACK: '+(keys.attack==='Space'?'SPACE':keys.attack.replace('Arrow',''));
 $('jumpKey').classList.toggle('listening',remap==='jump');$('attackKey').classList.toggle('listening',remap==='attack');
}
$('startBtn').addEventListener('click',reset);
$('jumpKey').addEventListener('click',()=>{remap='jump';refreshKeys();$('jumpKey').textContent='PRESS A KEY'});
$('attackKey').addEventListener('click',()=>{remap='attack';refreshKeys();$('attackKey').textContent='PRESS A KEY'});
$('jumpTouch').addEventListener('pointerdown',jump);$('attackTouch').addEventListener('pointerdown',attack);
document.addEventListener('keydown',keyDown);
document.addEventListener('visibilitychange',()=>{if(document.hidden)lastTime=0});
refreshKeys();requestAnimationFrame(loop);
</script>
</body>
</html>
