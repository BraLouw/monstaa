<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>monstaa!</title>
    <style>
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 36px;
            color: #a82323;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000000;
        }
        #game-container {
            position: relative;
            width: 600px;
            height: 200px;
            background-color: #222222;
            border: 4px solid #444444;
            box-shadow: 0 0 20px rgba(168, 35, 35, 0.4);
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #222222;
            image-rendering: pixelated;
        }
        #status-banner {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 2px 2px #000000;
            display: none;
            z-index: 10;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }
        #start-btn {
            background-color: #238636;
            border: 3px solid #2ea44f;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            font-weight: bold;
            padding: 12px 35px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 0px #144f1e;
            text-shadow: 1px 1px 0px #000000;
            outline: none;
        }
        #start-btn:hover {
            background-color: #2ea44f;
        }
        #start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px #144f1e;
        }
        .settings-panel {
            margin-top: 20px;
            background-color: #1a1a1a;
            border: 2px solid #333333;
            border-radius: 6px;
            padding: 15px;
            width: 560px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .settings-title {
            font-size: 14px;
            color: #888888;
            margin: 0 0 5px 0;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #222222;
            padding: 8px 15px;
            border-radius: 4px;
            border: 1px solid #2d2d2d;
        }
        .control-label {
            font-size: 16px;
            color: #d1d0c5;
            font-weight: bold;
        }
        .key-box {
            background-color: #333333;
            color: #e2b714;
            border: 2px solid #444444;
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            min-width: 90px;
            text-align: center;
            transition: all 0.2s;
        }
        .key-box:hover {
            background-color: #444444;
            border-color: #e2b714;
        }
        .key-box.listening {
            background-color: #a82323;
            color: #ffffff;
            border-color: #ff4444;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <h1>monstaa!</h1>
    <div id="game-container">
        <div id="start-overlay">
<button id="start-btn" onclick="startGame()">START GAME</button>
        </div>
        <div id="status-banner">FIGHT!</div>
        <!-- FIXED: Set width and height dimensions directly into the canvas element properties -->
        <canvas id="gameCanvas" width="600" height="200"></canvas>
    </div>

    <div class="settings-panel">
        <div class="settings-title">Control Settings (Click a key box to change mapping)</div>
        <div class="control-row">
            <span class="control-label">Jump (Running Mode)</span>
            <div id="jump-mapping" class="key-box" onclick="startRemap('jump', event)">Space</div>
        </div>
        <div class="control-row">
            <span class="control-label">Attack / Tag (Fight Mode)</span>
            <div id="attack-mapping" class="key-box" onclick="startRemap('attack', event)">Space</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const statusBanner = document.getElementById("status-banner");
        const startOverlay = document.getElementById("start-overlay");

        let keyConfig = {
            jump: "Space",
            attack: "Space"
        };
        let activeRemappingAction = null;

        let score = 0;
        let successfulJumps = 0;
        let gameMode = "NOT_STARTED"; 
        let gameSpeed = 5;
        let gameInterval = null;

        const monster = {
            x: 50,
            y: 140,
            width: 30,
            height: 30,
            vy: 0,
            gravity: 0.6,
            jumpStrength: -11,
            isGrounded: true,
            color: "#44aa44",
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(this.x + 20, this.y + 6, 6, 6);
                ctx.fillStyle = "#000000";
                ctx.fillRect(this.x + 24, this.y + 8, 2, 2);
                ctx.fillStyle = "#222222";
                ctx.fillRect(this.x + 16, this.y + 20, 10, 4);
                ctx.fillRect(this.x + 20, this.y + 18, 2, 2);
            },
            jump() {
                if (this.isGrounded && gameMode === "RUNNING") {
                    this.vy = this.jumpStrength;
                    this.isGrounded = false;
                }
            },
            attack() {
                if (gameMode === "FIGHTING" && enemy) {
                    this.x += 15;
                    enemy.hp -= 25;
                    if (enemy.hp <= 0) {
                        score += 50;
                        successfulJumps = 0;
                        gameMode = "RUNNING";
                        statusBanner.style.display = "none";
                        enemy = null;
                        obstacle.x = canvas.width + 100;
                    }
                }
            },
            update() {
                this.vy += this.gravity;
                this.y += this.vy;

                if (this.y >= 140) {
                    this.y = 140;
                    this.vy = 0;
                    this.isGrounded = true;
                }

                if (this.x > 50) this.x -= 2;
            }
        };

        const obstacle = {
            x: 700,
            y: 145,
            width: 20,
            height: 25,
            passed: false,
            draw() {
                ctx.fillStyle = "#a82323";
                ctx.fillRect(this.x + 5, this.y, 10, this.height);
                ctx.fillRect(this.x, this.y + 10, 20, 15);
            },
            update() {
                this.x -= gameSpeed;

                if (!this.passed && this.x < monster.x) {
                    this.passed = true;
                    score += 10;
                    successfulJumps++;

                    if (successfulJumps >= 5) {
                        triggerFightMode();
                    }
                }

                if (this.x < -this.width) {
                    this.x = canvas.width + Math.random() * 200;
                    this.passed = false;
                }
            }
        };

        let enemy = null;
        function createEnemy() {
            return {
                x: 450,
                y: 130,
                width: 40,
                height: 40,
                hp: 100,
                attackTimer: 0,
                draw() {
                    ctx.fillStyle = "#8a33bd";
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.fillStyle = "#ff0000";
                    ctx.fillRect(this.x, this.y - 15, this.width, 5);
                    ctx.fillStyle = "#00ff00";
                    ctx.fillRect(this.x, this.y - 15, this.width * (this.hp / 100), 5);
                },
                update() {
                    this.attackTimer++;
                    if (this.attackTimer % 90 === 0) {
                        monster.color = "#ff0000";
                        setTimeout(() => monster.color = "#44aa44", 150);
                        if (monster.x < 60) {
                            gameOver();
                        }
                    }
                }
            };
        }

     function startGame() {
            startOverlay.style.display = "none";
            resetGame();
        }

   function triggerFightMode() {
    gameMode = "FIGHTING";
    statusBanner.style.display = "block";
    enemy = createEnemy();
}

function gameOver() {
    gameMode = "GAME_OVER";
    clearInterval(gameInterval);
    statusBanner.style.display = "block";
    statusBanner.textContent = "GAME OVER!";

    startOverlay.style.display = "flex";
    document.getElementById("start-btn").textContent = "PLAY AGAIN";
}

function resetGame() {
    score = 0;
    successfulJumps = 0;
    gameSpeed = 5;
    gameMode = "RUNNING";

    monster.x = 50;
    monster.y = 140;
    monster.vy = 0;
    monster.isGrounded = true;
    monster.color = "#44aa44";

    obstacle.x = 700;
    obstacle.passed = false;

    enemy = null;

    statusBanner.style.display = "none";

    if (gameInterval) clearInterval(gameInterval);

    gameInterval = setInterval(gameLoop, 20);
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameMode === "RUNNING") {
        monster.update();
        obstacle.update();

        monster.draw();
        obstacle.draw();

    } else if (gameMode === "FIGHTING") {
        monster.update();
        enemy.update();

        monster.draw();
        enemy.draw();
    }

    if (gameMode !== "GAME_OVER") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "14px Courier New";
        ctx.fillText("Score: " + score, 10, 20);
    }
}

document.addEventListener("keydown", function(event) {
    if (event.code === keyConfig.jump) {
        if (gameMode === "RUNNING") {
            event.preventDefault();
            monster.jump();
        } else if (gameMode === "FIGHTING") {
            event.preventDefault();
            monster.attack();
        }
    }
});
